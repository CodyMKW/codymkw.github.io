<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Inbox</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --accent-a:#4f6bff; --accent-b:#8b5cf6;
    --accent: var(--accent-a);
    --bg:#f3f4fa; --panel:#ffffff; --panel-2:#fafaff; --fg:#14161b; --muted:#70758a; --border:#e7e8f1;
    --bubble-in-bg:#f1f2f7; --bubble-in-fg:#14161b; --input-bg:#f6f7fb;
    --danger:#ef4444; --online:#22c55e;
    --shadow-sm:0 1px 2px rgba(20,22,40,.04);
    --shadow-md:0 10px 30px rgba(20,22,40,.10);
    --shadow-lg:0 24px 60px rgba(20,22,40,.22);
    --radius:16px;
    --font-display:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0d0f15; --panel:#161922; --panel-2:#12141b; --fg:#edeff4; --muted:#8b91a3; --border:#262a37;
    --bubble-in-bg:#20232d; --bubble-in-fg:#edeff4; --input-bg:#1b1e28;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.4);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---------- sidebar ---------- */
  #sidebar{width:308px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  #sidebar-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
  #sidebar-header .row-1{display:flex;align-items:center;justify-content:space-between;}
  #sidebar-header h1{font-family:var(--font-display);font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em;}
  #sidebar-header .actions{display:flex;gap:4px;}
  .icon-btn{border:none;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .12s ease, color .12s ease;}
  .icon-btn:hover{background:var(--input-bg);color:var(--fg);}

  .presence-pill{
    margin-top:12px;display:inline-flex;align-items:center;gap:7px;
    padding:6px 11px 6px 9px;border-radius:999px;
    background:var(--input-bg);border:1px solid var(--border);
    font-size:11.5px;font-weight:600;color:var(--muted);
  }
  .presence-pill .pulse-wrap{position:relative;width:8px;height:8px;flex-shrink:0;}
  .presence-pill .pulse-dot{position:absolute;inset:0;border-radius:50%;background:#9aa1b4;}
  .presence-pill.live .pulse-dot{background:var(--online);}
  .presence-pill.live .pulse-ring{position:absolute;inset:-4px;border-radius:50%;background:var(--online);opacity:.5;animation:pulse-ring 1.8s ease-out infinite;}
  @keyframes pulse-ring{0%{transform:scale(.5);opacity:.55;}100%{transform:scale(2.2);opacity:0;}}

  .filter-tabs{display:flex;gap:4px;margin-top:12px;background:var(--input-bg);border-radius:10px;padding:3px;}
  .filter-tab{flex:1;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;font-family:var(--font-display);padding:6px 0;border-radius:8px;cursor:pointer;transition:background .12s ease, color .12s ease;}
  .filter-tab.active{background:var(--panel);color:var(--fg);box-shadow:var(--shadow-sm);}
  .search-input{width:100%;margin-top:10px;padding:8px 11px;border:1px solid var(--border);background:var(--input-bg);color:var(--fg);border-radius:9px;font:inherit;font-size:12.5px;outline:none;transition:border-color .12s ease;}
  .search-input:focus{border-color:var(--accent-a);}
  .closed-chip{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--input-bg);border:1px solid var(--border);padding:1px 6px;border-radius:6px;flex-shrink:0;}

  #session-list{flex:1;overflow-y:auto;padding:8px;}
  .session-row{display:flex;gap:11px;padding:11px 10px;border-radius:12px;cursor:pointer;position:relative;transition:background .12s ease;}
  .session-row:hover{background:var(--input-bg);}
  .session-row.active{background:linear-gradient(180deg, var(--panel-2), var(--input-bg));box-shadow:inset 0 0 0 1px var(--border);}
  .avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .session-row .body{min-width:0;flex:1;}
  .session-row .row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .session-row .site{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display);}
  .session-row .time{font-size:10.5px;color:var(--muted);flex-shrink:0;}
  .session-row .preview{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .unread-badge{
    position:absolute;top:9px;right:10px;
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    color:#fff;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .empty-list{padding:40px 20px;color:var(--muted);font-size:13px;text-align:center;line-height:1.5;}

  /* ---------- conversation ---------- */
  #conversation{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  #empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:14px;}
  #empty-state[hidden]{display:none;}
  #empty-state svg{width:52px;height:52px;opacity:.35;}
  #empty-state .headline{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--fg);}
  #empty-state .sub{font-size:13px;}

  #thread{flex:1;display:flex;flex-direction:column;min-height:0;}
  #thread[hidden]{display:none;}
  #thread-header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border);background:var(--panel);}
  #thread-header .info{min-width:0;flex:1;}
  #thread-header strong{font-family:var(--font-display);font-size:15px;display:block;}
  #thread-header .sub{font-size:12px;color:var(--muted);}
  .thread-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn.danger:hover{background:rgba(239,68,68,.12);color:var(--danger);}

  #thread-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:10px;}
  .msg-row{display:flex;animation:msg-in .18s ease both;}
  @keyframes msg-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .msg{max-width:58%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.48;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm);}
  .msg-row.visitor{justify-content:flex-start;}
  .msg-row.support{justify-content:flex-end;}
  .msg.from-visitor{background:var(--bubble-in-bg);color:var(--bubble-in-fg);border-bottom-left-radius:5px;}
  .msg.from-support{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff;border-bottom-right-radius:5px;}

  #reply-form{display:flex;align-items:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:var(--panel);}
  #reply-input{flex:1;resize:none;min-height:42px;max-height:130px;border:1px solid var(--border);background:var(--input-bg);color:var(--fg);border-radius:12px;padding:10px 13px;font:inherit;font-size:13.5px;outline:none;transition:border-color .12s ease;}
  #reply-input:focus{border-color:var(--accent-a);}
  #reply-send{
    border:none;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    color:#fff;width:42px;height:42px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .1s ease, opacity .1s ease;
  }
  #reply-send:hover{transform:translateY(-1px);}
  #reply-send:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  #reply-send svg{width:17px;height:17px;}

  /* ---------- settings modal ---------- */
  #settings-modal{position:fixed;inset:0;background:rgba(10,12,20,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:10;}
  #settings-modal[hidden]{display:none;}
  .modal-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px;width:360px;max-width:90vw;box-shadow:var(--shadow-lg);}
  .modal-card h2{margin:0 0 4px;font-family:var(--font-display);font-size:17px;font-weight:800;}
  .modal-card p{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .modal-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:14px;}
  .modal-card input{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--border);background:var(--input-bg);color:var(--fg);border-radius:10px;font:inherit;font-size:13px;outline:none;transition:border-color .12s ease;}
  .modal-card input:focus{border-color:var(--accent-a);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .modal-actions button{border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-display);}
  #cfg-save{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff;}
  #cfg-cancel{background:var(--input-bg);color:var(--fg);}
  .status-line{font-size:11.5px;color:var(--danger);margin-top:-6px;margin-bottom:12px;min-height:14px;}

  #back-btn{display:none;}
  @media (max-width:720px){
    #sidebar{position:fixed;inset:0;z-index:5;transform:translateX(-100%);transition:transform .18s ease;width:100%;}
    #sidebar.mobile-open{transform:translateX(0);}
    #conversation{width:100%;}
    #back-btn{display:inline-flex !important;}
    .msg{max-width:78%;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <div class="row-1">
        <h1>Support Inbox</h1>
        <div class="actions">
          <button class="icon-btn" id="theme-toggle" title="Toggle theme">◐</button>
          <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
        </div>
      </div>
      <span class="presence-pill" id="presence-pill">
        <span class="pulse-wrap"><span class="pulse-ring" id="pulse-ring"></span><span class="pulse-dot"></span></span>
        <span id="presence-label">Connecting…</span>
      </span>
      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" type="button" data-filter="open">Open</button>
        <button class="filter-tab" type="button" data-filter="closed">Closed</button>
        <button class="filter-tab" type="button" data-filter="all">All</button>
      </div>
      <input class="search-input" id="search-input" type="text" placeholder="Search name or site…" autocomplete="off" />
    </div>
    <div id="session-list"><div class="empty-list">Loading…</div></div>
  </aside>
  <main id="conversation">
    <div id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12c0-4.42 3.58-8 8-8s8 3.58 8 8-3.58 8-8 8c-1.1 0-2.15-.2-3.11-.58L4 21l1.66-4.6C4.6 15.06 4 13.6 4 12z" stroke="currentColor" stroke-width="1.6"/></svg>
      <div class="headline">No conversation selected</div>
      <div class="sub">Pick one on the left to start replying.</div>
    </div>
    <div id="thread" hidden>
      <header id="thread-header">
        <button class="icon-btn" id="back-btn">←</button>
        <div class="avatar" id="thread-avatar"></div>
        <div class="info">
          <strong id="thread-site"></strong>
          <span class="sub" id="thread-sub">Conversation</span>
        </div>
        <div class="thread-actions">
          <button class="icon-btn" id="toggle-status-btn" type="button" title="Close conversation">✓</button>
          <button class="icon-btn danger" id="delete-btn" type="button" title="Delete conversation">🗑</button>
        </div>
      </header>
      <div id="thread-messages"></div>
      <form id="reply-form">
        <textarea id="reply-input" rows="1" placeholder="Type a reply…" maxlength="2000"></textarea>
        <button type="submit" id="reply-send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20l16-8L4 4v6l10 2-10 2v6z" fill="currentColor"/></svg>
        </button>
      </form>
    </div>
  </main>
</div>

<div id="settings-modal">
  <div class="modal-card">
    <h2>Connect your worker</h2>
    <p>Paste your Cloudflare Worker URL and the admin token you set as a secret.</p>
    <label>Worker URL
      <input id="cfg-worker" placeholder="https://support-chat.you.workers.dev" autocomplete="off" />
    </label>
    <label>Admin token
      <input id="cfg-token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
    </label>
    <div class="status-line" id="cfg-status"></div>
    <div class="modal-actions">
      <button id="cfg-cancel" type="button">Cancel</button>
      <button id="cfg-save" type="button">Save & connect</button>
    </div>
  </div>
</div>

<script>
(function(){
  var LS_WORKER = 'scw_admin_worker';
  var LS_TOKEN = 'scw_admin_token';
  var LS_THEME = 'scw_admin_theme';

  var WORKER = localStorage.getItem(LS_WORKER) || '';
  var TOKEN = localStorage.getItem(LS_TOKEN) || '';

  var AVATAR_COLORS = ['#4f6bff','#8b5cf6','#ec4899','#f97316','#10b981','#06b6d4','#f43f5e','#6366f1'];

  var sessions = [];
  var currentId = null;
  var currentRendered = 0;
  var currentStatus = 'open';
  var currentFilter = 'open';
  var currentSearch = '';
  var sessionsTimer = null;
  var threadTimer = null;
  var heartbeatTimer = null;

  var el = {
    list: document.getElementById('session-list'),
    emptyState: document.getElementById('empty-state'),
    thread: document.getElementById('thread'),
    threadAvatar: document.getElementById('thread-avatar'),
    threadSite: document.getElementById('thread-site'),
    threadSub: document.getElementById('thread-sub'),
    threadMessages: document.getElementById('thread-messages'),
    replyForm: document.getElementById('reply-form'),
    replyInput: document.getElementById('reply-input'),
    replySend: document.getElementById('reply-send'),
    settingsModal: document.getElementById('settings-modal'),
    cfgWorker: document.getElementById('cfg-worker'),
    cfgToken: document.getElementById('cfg-token'),
    cfgStatus: document.getElementById('cfg-status'),
    cfgSave: document.getElementById('cfg-save'),
    cfgCancel: document.getElementById('cfg-cancel'),
    settingsBtn: document.getElementById('settings-btn'),
    themeToggle: document.getElementById('theme-toggle'),
    backBtn: document.getElementById('back-btn'),
    sidebar: document.getElementById('sidebar'),
    presencePill: document.getElementById('presence-pill'),
    presenceLabel: document.getElementById('presence-label'),
    filterTabs: document.getElementById('filter-tabs'),
    searchInput: document.getElementById('search-input'),
    toggleStatusBtn: document.getElementById('toggle-status-btn'),
    deleteBtn: document.getElementById('delete-btn'),
  };

  // ---------- avatar helpers ----------
  function hashStr(s){
    var h = 0;
    for(var i=0;i<s.length;i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function avatarColor(site){
    return AVATAR_COLORS[hashStr(site || '?') % AVATAR_COLORS.length];
  }
  function initials(site){
    if(!site) return '?';
    var words = site.trim().split(/\s+/).filter(Boolean);
    if(!words.length) return '?';
    if(words.length === 1) return words[0].slice(0,2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }
  function paintAvatar(elm, site){
    elm.textContent = initials(site);
    elm.style.background = avatarColor(site || '?');
  }

  // ---------- theme ----------
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(LS_THEME, t);
  }
  var savedTheme = localStorage.getItem(LS_THEME);
  applyTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  el.themeToggle.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // ---------- settings ----------
  function configured(){ return !!(WORKER && TOKEN); }
  function openSettings(){
    el.cfgWorker.value = WORKER;
    el.cfgToken.value = TOKEN;
    el.cfgStatus.textContent = '';
    el.cfgCancel.style.display = configured() ? 'inline-block' : 'none';
    el.settingsModal.hidden = false;
  }
  function closeSettings(){ el.settingsModal.hidden = true; }
  el.settingsBtn.addEventListener('click', function(){ openSettings(); });
  el.cfgCancel.addEventListener('click', closeSettings);
  el.cfgSave.addEventListener('click', function(){
    var w = el.cfgWorker.value.trim().replace(/\/$/, '');
    var t = el.cfgToken.value.trim();
    if(!w || !t){ el.cfgStatus.textContent = 'Both fields are required.'; return; }
    WORKER = w; TOKEN = t;
    localStorage.setItem(LS_WORKER, WORKER);
    localStorage.setItem(LS_TOKEN, TOKEN);
    closeSettings();
    startPolling();
  });

  // ---------- filters ----------
  el.filterTabs.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-tab');
    if(!btn) return;
    currentFilter = btn.dataset.filter;
    Array.prototype.forEach.call(el.filterTabs.querySelectorAll('.filter-tab'), function(b){
      b.classList.toggle('active', b === btn);
    });
    renderSessions();
  });
  el.searchInput.addEventListener('input', function(){
    currentSearch = el.searchInput.value.trim().toLowerCase();
    renderSessions();
  });

  // ---------- api ----------
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Admin-Token': TOKEN }, opts.headers || {});
    return fetch(WORKER + path, opts).then(function(r){
      if(r.status === 401){ throw new Error('unauthorized'); }
      if(!r.ok){ throw new Error('request failed: ' + r.status); }
      return r.json();
    });
  }

  // ---------- presence (you're online while this tab is open) ----------
  function sendHeartbeat(){
    if(!configured()) return;
    api('/api/presence', { method: 'POST' })
      .then(function(){
        el.presencePill.classList.add('live');
        el.presenceLabel.textContent = "You're live";
      })
      .catch(function(){
        el.presencePill.classList.remove('live');
        el.presenceLabel.textContent = 'Connection issue';
      });
  }

  // ---------- time formatting ----------
  function relTime(ts){
    var diff = Date.now() - ts;
    var m = Math.round(diff / 60000);
    if(m < 1) return 'just now';
    if(m < 60) return m + 'm ago';
    var h = Math.round(m / 60);
    if(h < 24) return h + 'h ago';
    var d = Math.round(h / 24);
    if(d < 7) return d + 'd ago';
    return new Date(ts).toLocaleDateString();
  }

  // ---------- session list ----------
  function getFilteredSessions(){
    return sessions.filter(function(s){
      var status = s.status || 'open';
      if(currentFilter !== 'all' && status !== currentFilter) return false;
      if(currentSearch){
        var hay = ((s.name || '') + ' ' + (s.site || '')).toLowerCase();
        if(hay.indexOf(currentSearch) === -1) return false;
      }
      return true;
    });
  }

  function renderSessions(){
    var visible = getFilteredSessions();
    if(!visible.length){
      el.list.innerHTML = sessions.length
        ? '<div class="empty-list">Nothing matches here.</div>'
        : '<div class="empty-list">No conversations yet — once someone messages you from the widget, they\'ll show up here.</div>';
      return;
    }
    el.list.innerHTML = '';
    visible.forEach(function(s){
      var identity = s.name || s.site || 'Unknown';
      var row = document.createElement('div');
      row.className = 'session-row' + (s.id === currentId ? ' active' : '');
      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      paintAvatar(avatar, identity);
      row.appendChild(avatar);

      var body = document.createElement('div');
      body.className = 'body';
      body.innerHTML =
        '<div class="row-top"><span class="site"></span><span class="time"></span></div>' +
        '<div class="preview"></div>';
      body.querySelector('.site').textContent = identity;
      var timeCell = body.querySelector('.time');
      if(currentFilter === 'all' && (s.status || 'open') === 'closed'){
        var chip = document.createElement('span');
        chip.className = 'closed-chip';
        chip.textContent = 'Closed';
        timeCell.parentNode.insertBefore(chip, timeCell);
      }
      timeCell.textContent = relTime(s.lastMessageAt);
      var preview = (s.site ? s.site + ' · ' : '') + (s.lastMessageFrom === 'support' ? 'You: ' : '') + (s.lastMessageText || '');
      body.querySelector('.preview').textContent = preview;
      row.appendChild(body);

      if(s.unreadSupportCount && s.id !== currentId){
        var badge = document.createElement('span');
        badge.className = 'unread-badge';
        badge.textContent = s.unreadSupportCount > 9 ? '9+' : String(s.unreadSupportCount);
        row.appendChild(badge);
      }
      row.addEventListener('click', function(){ selectSession(s.id, s.site, s.name, s.status || 'open'); });
      el.list.appendChild(row);
    });
  }

  function fetchSessions(){
    if(!configured()) return;
    api('/api/sessions')
      .then(function(data){
        sessions = data.sessions || [];
        renderSessions();
        var totalUnread = sessions.reduce(function(sum, s){ return sum + (s.unreadSupportCount || 0); }, 0);
        document.title = (totalUnread > 0 ? '(' + (totalUnread > 99 ? '99+' : totalUnread) + ') ' : '') + 'Support Inbox';
      })
      .catch(function(e){
        if(e.message === 'unauthorized'){
          el.list.innerHTML = '<div class="empty-list">Token rejected — check Settings.</div>';
        }
      });
  }

  // ---------- thread ----------
  function addBubble(from, text){
    var row = document.createElement('div');
    row.className = 'msg-row ' + (from === 'support' ? 'support' : 'visitor');
    var b = document.createElement('div');
    b.className = 'msg ' + (from === 'support' ? 'from-support' : 'from-visitor');
    b.textContent = text;
    row.appendChild(b);
    el.threadMessages.appendChild(row);
  }
  function scrollThreadToBottom(){
    el.threadMessages.scrollTop = el.threadMessages.scrollHeight;
  }

  function selectSession(id, site, name, status){
    currentId = id;
    currentRendered = 0;
    currentStatus = status || 'open';
    el.threadMessages.innerHTML = '';
    var identity = name || site || 'Unknown';
    paintAvatar(el.threadAvatar, identity);
    el.threadSite.textContent = identity;
    el.threadSub.textContent = (site || 'Unknown site') + (currentStatus === 'closed' ? ' · Closed' : '');
    el.emptyState.hidden = true;
    el.thread.hidden = false;
    el.sidebar.classList.remove('mobile-open');
    updateThreadActionLabels();
    renderSessions();
    pollThread(true);
  }

  function updateThreadActionLabels(){
    if(currentStatus === 'closed'){
      el.toggleStatusBtn.textContent = '↺';
      el.toggleStatusBtn.title = 'Reopen conversation';
    } else {
      el.toggleStatusBtn.textContent = '✓';
      el.toggleStatusBtn.title = 'Close conversation';
    }
  }

  el.toggleStatusBtn.addEventListener('click', function(){
    if(!currentId) return;
    var newStatus = currentStatus === 'closed' ? 'open' : 'closed';
    api('/api/session/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentId, status: newStatus })
    })
      .then(function(){
        currentStatus = newStatus;
        var subBase = el.threadSub.textContent.replace(' · Closed', '');
        el.threadSub.textContent = subBase + (newStatus === 'closed' ? ' · Closed' : '');
        updateThreadActionLabels();
        fetchSessions();
      })
      .catch(function(){ alert('Could not update — check the worker URL/token in Settings.'); });
  });

  el.deleteBtn.addEventListener('click', function(){
    if(!currentId) return;
    if(!confirm('Delete this conversation? This cannot be undone.')) return;
    var idToDelete = currentId;
    api('/api/session/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: idToDelete })
    })
      .then(function(){
        currentId = null;
        el.thread.hidden = true;
        el.emptyState.hidden = false;
        sessions = sessions.filter(function(s){ return s.id !== idToDelete; });
        renderSessions();
      })
      .catch(function(){ alert('Could not delete — check the worker URL/token in Settings.'); });
  });

  function pollThread(scroll){
    if(!currentId || !configured()) return;
    api('/api/messages?sessionId=' + encodeURIComponent(currentId) + '&after=' + currentRendered + '&as=support')
      .then(function(data){
        if(data.messages && data.messages.length){
          data.messages.forEach(function(m){ addBubble(m.from, m.text); });
          currentRendered += data.messages.length;
          if(scroll) scrollThreadToBottom();
        }
        fetchSessions();
      })
      .catch(function(){ /* retry next tick */ });
  }

  function autoGrow(){
    el.replyInput.style.height = 'auto';
    el.replyInput.style.height = Math.min(el.replyInput.scrollHeight, 130) + 'px';
  }
  el.replyInput.addEventListener('input', autoGrow);
  el.replyInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      el.replyForm.requestSubmit ? el.replyForm.requestSubmit() : sendReply();
    }
  });

  function sendReply(){
    var text = el.replyInput.value.trim();
    if(!text || !currentId) return;
    el.replySend.disabled = true;
    addBubble('support', text);
    currentRendered += 1;
    scrollThreadToBottom();
    el.replyInput.value = '';
    autoGrow();
    api('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentId, from: 'support', text: text })
    })
      .catch(function(){ alert('Could not send — check the worker URL/token in Settings.'); })
      .then(function(){ el.replySend.disabled = false; fetchSessions(); });
  }
  el.replyForm.addEventListener('submit', function(e){ e.preventDefault(); sendReply(); });

  el.backBtn.addEventListener('click', function(){
    el.sidebar.classList.add('mobile-open');
  });

  // ---------- polling ----------
  function startPolling(){
    clearInterval(sessionsTimer);
    clearInterval(threadTimer);
    clearInterval(heartbeatTimer);
    fetchSessions();
    sendHeartbeat();
    sessionsTimer = setInterval(fetchSessions, 6000);
    threadTimer = setInterval(function(){ pollThread(false); }, 3000);
    heartbeatTimer = setInterval(sendHeartbeat, 20000);
  }

  if(!configured()){
    openSettings();
  } else {
    startPolling();
  }
})();
</script>
</body>
</html>
